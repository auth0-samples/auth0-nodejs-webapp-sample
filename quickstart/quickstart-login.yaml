 - title: "Use the API token to Access your Protected API Endpoint"
   contentBlocks:
     - type: snippet
       <<: *accessApiJava

nodejs:
 - title: "Obtaining an Access Token by Calling the Token Endpoint"
   contentBlocks:
     - type: snippet
       <<: *accessTokenNode
 - title: "Use the API token to Access your Protected API Endpoint"
   contentBlocks:
     - type: snippet
       <<: *accessApiNode

php:
 - title: "Obtaining an Access Token by Calling the Token Endpoint"
   contentBlocks:
     - type: snippet
       <<: *accessTokenPhp
 - title: "Use the API token to Access your Protected API Endpoint"
   contentBlocks:
     - type: snippet
       <<: *accessApiPhp

python:
 - title: "Obtaining an Access Token by Calling the Token Endpoint"
   contentBlocks:
     - type: snippet
       <<: *accessTokenPython
 - title: "Use the API token to Access your Protected API Endpoint"
   contentBlocks:
     - type: snippet
       <<: *accessApiPython

ruby:
 - title: "Obtaining an Access Token by Calling the Token Endpoint"
   contentBlocks:
     - type: snippet
       <<: *accessTokenRuby
 - title: "Use the API token to Access your Protected API Endpoint"
   contentBlocks:
     - type: snippet
