appType: "m2m"
technology: "m2m"
technologyLabel: "Machine-to-Machine"
defaultEnvFileName: &defaultEnvFileName ".env.local"

inputs:
  auth0Domain:
  auth0ClientId:
  auth0ClientSecret:
  auth0Audience:
  selectedApi:
  apiEndpoint:

placeholders:
  "%AUTH0_DOMAIN%":
    inputKey: "auth0Domain"
  "%AUTH0_CLIENT_ID%":
    inputKey: "auth0ClientId"
  "%AUTH0_CLIENT_SECRET%":
    inputKey: "auth0ClientSecret"
  "%AUTH0_AUDIENCE%":
    inputKey: "auth0Audience"
  "%SELECTED_API%":
    inputKey: "selectedApi"
  "%API_ENDPOINT%":
    inputKey: "apiEndpoint"

snippets:
  env: &env
    fileName: *defaultEnvFileName
    content: |
      AUTH0_DOMAIN=%AUTH0_DOMAIN%
      AUTH0_CLIENT_ID=%AUTH0_CLIENT_ID%
      AUTH0_CLIENT_SECRET=%AUTH0_CLIENT_SECRET%
      AUTH0_AUDIENCE=%AUTH0_AUDIENCE%
    language: "bash"
  m2mCurl: &m2mCurl
    source: "quickstart/snippets/curl-m2m.sh"
    language: "bash"
  curlGetToken: &curlGetToken
    source: "quickstart/snippets/curl-get-token.sh"
    language: "bash"
  curlCallApi: &curlCallApi
    source: "quickstart/snippets/curl-call-api.sh"
    language: "bash"
  csharp: &m2mCsharp
    source: "quickstart/snippets/csharp-m2m.cs"
    language: "csharp"
  go: &m2mGo
    source: "quickstart/snippets/go-m2m.go"
    language: "go"
  java: &m2mJava
    source: "quickstart/snippets/java-m2m.java"
    language: "java"
  node: &m2mNode
    source: "quickstart/snippets/node-m2m.js"
    language: "nodejs"
  php: &m2mPhp
    source: "quickstart/snippets/php-m2m.php"
    language: "php"
  python: &m2mPython
    source: "quickstart/snippets/python-m2m.py"
    language: "python"
  ruby: &m2mRuby
    source: "quickstart/snippets/ruby-m2m.rb"
    language: "ruby"

steps:
 - title: "Configure environment variables"
   contentBlocks:
      - type: markdown
        source: "quickstart/markdown/env-config.md"
      - type: snippet
        <<: *env
 - title: "Obtaining an Access Token & Calling your API"
   contentBlocks:
     - type: markdown
       source: "quickstart/markdown/obtain-access-token.md"
     - type: markdown
       source: "quickstart/markdown/access-api.md"
     - type: snippet
       sources:
         - <<: *m2mCurl
         - <<: *m2mCsharp
         - <<: *m2mGo
         - <<: *m2mJava
         - <<: *m2mNode
         - <<: *m2mPhp
         - <<: *m2mPython
         - <<: *m2mRuby

curl:
  - title: "Obtaining an Access Token"
    contentBlocks:
      - type: markdown
        source: "quickstart/markdown/obtain-access-token.md"
      - type: snippet
        <<: *curlGetToken
  - title: "Calling your API"
    contentBlocks:
      - type: markdown
        source: "quickstart/markdown/access-api.md"
      - type: snippet
        <<: *curlCallApi

nextSteps:
  links:
    - label: "Self-Service Machine-to-Machine"
      url: "https://auth0.com/docs/get-started/onboarding/self-service-m2m"
    - label: "Using Machine to Machine (M2M) Authorization"
      url: "https://auth0.com/blog/using-m2m-authorization/"

# Used by the CLI to generate the .env file
envSnippet: *env
