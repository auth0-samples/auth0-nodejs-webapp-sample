# We shouldn't do it this way, it might be its own section ("tryItOut")
tryOutStep: &tryOutStep
  - title: "Try it out"
    contentBlocks:
      - type: markdown
        source: "quickstart/markdown/try-steps.md"

nextSteps:
  links:
    - label: "Self-Service Machine-to-Machine"
      url: "https://auth0.com/docs/get-started/onboarding/self-service-m2m"
    - label: "Using Machine to Machine (M2M) Authorization"
      url: "https://auth0.com/blog/using-m2m-authorization/"

# Used by the CLI to generate the .env file
envSnippet: *env
